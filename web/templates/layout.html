<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <meta property="og:title" content="Face Recognition System" />
    <meta property="og:description" content="ระบบการจดจำใบหน้า (Face Recognition System) เป็นเทคโนโลยีที่ใช้ในการระบุหรือยืนยันตัวตนของบุคคลโดยการวิเคราะห์ลักษณะทางกายภาพของใบหน้า เช่น รูปทรงใบหน้า, ตำแหน่งของดวงตา, จมูก, ปาก และลักษณะเฉพาะอื่น ๆ ที่สามารถแยกแยะบุคคลได้อย่างแม่นยำ" />
    <meta property="og:image" content="{{ url_for('static', filename='image/1.png') }}" />
    <meta property="og:url" content="{{ url_for('index', _external=True) }}" />
    <meta property="og:type" content="website" />
    <title>{% block title %}Face Recognition System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light p-0 m-0">
        <div class="container p-2">    
          <ul class="me-auto mb-0 gap-2 d-flex list-unstyled">
              <li class="nav-item">
                  <a class="nav-link p-0 nav-link-menu" title="facebook" href="https://www.facebook.com/share/1Bs1BkbMoq/?mibextid=wwXIfr">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-facebook" viewBox="0 0 16 16">
                        <path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"/>
                      </svg>                            
                  </a>
              </li>
              <li class="nav-item">
                  <a class="nav-link p-0 nav-link-menu" title="github" href="https://github.com/chespathsaengtawan/FaceRecognition">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
                      </svg>
                  </a>
              </li>
          </ul>

          <button class="navbar-toggler p-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span id="togglerOpenIcon" class="d-inline-flex align-items-center">
              <!-- open icon (three dots vertical) -->
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                <path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0m0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
              </svg>
            </span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-0 mb-lg-0 gap-2">
              <!---
                <li class="nav-item">
                    <a class="nav-link active p-0 nav-link-menu" href="#">รายชื่อพนักงาน</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active p-0 nav-link-menu" href="#">ตั้งค่าอุปกรณ์</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active p-0 nav-link-menu" href="#">ประวัติพนักงาน</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active p-0 nav-link-menu" href="#">เข้าสู่ระบบ</a>
                </li>
              -->
                <li class="nav-item">
                    <a class="nav-link active p-0 nav-link-menu" href="https://github.com/chespathsaengtawan/FaceRecognition">อ่านเพิ่มเติม</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active p-0 nav-link-menu" href="https://www.facebook.com/share/1Bs1BkbMoq/?mibextid=wwXIfr">ติดต่อเรา</a>
                </li>
            </ul>
          </div>
        </div>
    </nav>
     {% block content %}{% endblock %}
     
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script>
  (function(){
    const collapseEl = document.getElementById('navbarSupportedContent');
    const openIcon = document.getElementById('togglerOpenIcon');
    const closeIcon = document.getElementById('togglerCloseIcon');
    if (collapseEl && openIcon && closeIcon) {
      collapseEl.addEventListener('show.bs.collapse', () => {
        openIcon.style.display = 'none';
        closeIcon.style.display = 'inline-flex';
      });
      collapseEl.addEventListener('hide.bs.collapse', () => {
        openIcon.style.display = 'inline-flex';
        closeIcon.style.display = 'none';
      });
      // sync initial state (in case collapsed state differs)
      if (collapseEl.classList.contains('show')) {
        openIcon.style.display = 'none';
        closeIcon.style.display = 'inline-flex';
      }
    }
  })();
</script>
</body>
</html>
