<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .employee-card {
            border: 1px solid #ddd;        
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            background-color: white;
        }
        .employee-image {
            max-width: 200px;
            height: auto;
            border-radius: 4px;
            margin-left: auto;
            margin-right: auto;
            display: block;
        }
        .header-purple {
            background-color: #6f42c1;
            color: white;
            padding: 5px 0;
        }
        body {

            background-color: #f8f9fa;
        }
        .nav-link-menu {
            color: white !important;
            font-size: small;
        }   
    </style>
</head>
<body>

        <div class="container-fluid p-2">
            
                <ul class="navbar-nav me-auto mb-0 mb-lg-0 gap-1">
                    <li class="nav-item">
                        <a class="nav-link ms-2 p-0 nav-link-menu" href="https://www.facebook.com/share/1Bs1BkbMoq/?mibextid=wwXIfr">

                            </svg>                            
                        </a>
                    </li>

                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto mb-0 mb-lg-0 gap-2">
                    <li class="nav-item">
                        <a class="nav-link active p-0 nav-link-menu" href="#">รายชื่อพนักงาน</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active p-0 nav-link-menu" href="#">ตั้งค่าอุปกรณ์</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active p-0 nav-link-menu" href="#">ประวัติพนักงาน</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active p-0 nav-link-menu" href="#">เข้าสู่ระบบ</a>
                    </li>
                </ul>
        </div>
    </nav>
    <div class="header-purple mb-4">
        <div class="container">   
            <h3 class="text-center">Face Recognition System</h3>
            <p class="text-center">ระบบจดจำใบหน้าเพื่อการจัดการพนักงาน</p>
        </div>
    </div>

    <div class="container">
        <!-- Employee Management Section -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-purple text-white" style="background-color: #6f42c1;">
                        <h3 class="mb-0">Employee Management</h3>
                    </div>
                    <div class="card-body">
                        <form id="employeeForm" class="mb-4">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="en" class="form-label">รหัสพนักงาน (ID)</label>
                                        <input type="text" class="form-control" id="en" required>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">ชื่อ (Name)</label>
                                        <input type="text" class="form-control" id="name" required>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="image" class="form-label">รูปภาพ (Image)</label>
                                        <input type="file" class="form-control" id="image" accept="image/*" required>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">เพิ่มรายชื่อพนักงาน</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Employee List Section -->
        <div class="row" id="employeeList">
            {% for employee in employees %}
            <div class="col-md-4 mb-4">
                <div class="employee-card ">
                    <div>
                    <h5>ID : {{ employee.EN }}</h5>
                    <h6>Name : {{ employee.NAME }}</h6>                        
                    </div>
                    <img src="data:image/jpeg;base64,{{ employee.IMAGE_BINARY }}" 
                         alt="{{ employee.NAME }}" 
                         class="employee-image mb-3 p-auto d-block">

                    <div class="mt-3 d-flex justify-content-center gap-2">
                        <button class="btn btn-warning btn-sm edit-btn" 
                                data-en="{{ employee.EN }}">Edit</button>
                        <button class="btn btn-danger btn-sm delete-btn" 
                                data-en="{{ employee.EN }}">Delete</button>
                        <button class="btn btn-success btn-sm active-btn" 
                                data-en="{{ employee.EN }}">Active</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('employeeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('en', document.getElementById('en').value);
            formData.append('name', document.getElementById('name').value);
            formData.append('image', document.getElementById('image').files[0]);

            try {
                const response = await fetch('/employee', {
                    method: 'POST',
                    body: formData
                });
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Error adding employee');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error adding employee');
            }
        });

        // Delete button handler
        document.querySelectorAll('.delete-btn').forEach(button => {
            button.addEventListener('click', async () => {
                if (confirm('Are you sure you want to delete this employee?')) {
                    const en = button.getAttribute('data-en');
                    try {
                        const response = await fetch(`/employee/${en}`, {
                            method: 'DELETE'
                        });
                        if (response.ok) {
                            window.location.reload();
                        } else {
                            alert('Error deleting employee');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Error deleting employee');
                    }
                }
            });
        });
    </script>
</body>
</html>
